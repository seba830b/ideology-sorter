name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Validate and compile the knowledge base
        run: npm run kb
      - name: Engine tests
        run: npm test
      - name: Simulation harness
        run: npm run sim -- --quick
