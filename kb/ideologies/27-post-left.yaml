    name: "Zerowork"
    prior_weight: 0.02
    blurb: "Sabotage, absenteeism and go-slows read as the real content of class struggle."
    positions:
      work_ethic: [work_abolished, core]
      class_analysis: [central_marxist, core]
      organisation_form: [affinity_group, core]
      transition_method: [prefigurative, strong]
      vanguard_role: [rejected, core]
      electoral_participation: [boycott, core]
      hierarchy_stance: [abolish, strong]
  - id: anti_work_politics
    name: "Anti-work politics"
    prior_weight: 0.08
    blurb: "Most jobs are pointless and coercive; the goal is to need far fewer of them."
    positions:
      work_ethic: [work_abolished, core]
      basic_income: [support_ubi, core]
      technology_stance: [accelerate, strong]
      distribution_principle: [need, strong]
