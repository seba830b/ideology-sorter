ideologies:
  - id: post_left_anarchy
    name: "Post-left anarchy"
    aliases: [Bob Black, McQuinn]
    prior_weight: 0.06
    blurb: "Drop the leftist baggage — morality, organisation, work and the workers' movement — and keep the anarchy."
    positions:
      organisation_form: [none, core]
      work_ethic: [work_abolished, core]
      class_analysis: [rejected, core]
      utopian_horizon: [none_pragmatic, core]
      state_trajectory: [abolish_now, core]
      rights_basis: [none_power, strong]
      electoral_participation: [boycott, core]
      hierarchy_stance: [abolish, core]
      tradition_stance: [reject, strong]
  - id: individualist_nihilism
    name: "Individualist nihilism"
    prior_weight: 0.04
    blurb: "No values survive scrutiny, so act from your own will and expect nothing to follow."
    positions:
      rights_basis: [none_power, core]
      utopian_horizon: [none_pragmatic, core]
      sovereignty_locus: [individual, core]
      organisation_form: [none, core]
