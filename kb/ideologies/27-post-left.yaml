      tradition_stance: [reject, core]
      transition_method: [withdrawal, strong]

  - id: refusal_of_work
    name: "Refusal of work"
    aliases: [Lafargue, the right to be lazy]
    prior_weight: 0.06
    blurb: "The work ethic is the ruling class's best invention; the demand should be less work, not more jobs."
    positions:
      work_ethic: [work_abolished, core]
      basic_income: [support_ubi, strong]
      class_analysis: [central_marxist, strong]
      transition_method: [general_strike, strong]
