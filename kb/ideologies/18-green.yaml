      welfare_provision: [universal_public, strong]
      immigration: [welcome, strong]
  - id: eco_socialism
    name: "Eco-socialism"
    prior_weight: 0.3
    blurb: "The ecological crisis is caused by capital accumulation, so it cannot be solved without ending it."
