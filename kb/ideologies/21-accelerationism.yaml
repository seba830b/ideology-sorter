    name: "Left accelerationism"
    aliases: [Srnicek, Williams, "#Accelerate"]
    prior_weight: 0.08
    blurb: "Repurpose capitalism's technologies rather than retreat from them; demand full automation and the end of work."
    positions:
      technology_stance: [accelerate, core]
      work_ethic: [work_abolished, core]
