ideologies:
  - id: third_way
    name: "Third Way"
    aliases: [Giddens, Blairism]
    prior_weight: 0.2
    blurb: "Beyond left and right — market mechanisms delivering social goals, with rights matched by responsibilities."
    positions:
      economic_coordination: [regulated_market, core]
      market_role: [central, core]
      welfare_provision: [insurance_contributory, core]
      transition_method: [gradual_reform, core]
      utopian_horizon: [gradual_improvement, core]
