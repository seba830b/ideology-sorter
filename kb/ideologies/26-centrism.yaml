      state_scope: [welfare_broad, strong]
      decision_procedure: [expert_rule, strong]
      electoral_participation: [central, core]
      work_ethic: [work_is_duty, strong]
      punishment: [deterrent_proportional, strong]

  - id: clintonism
    name: "New Democrat centrism"
    prior_weight: 0.1
    blurb: "Fiscal discipline, welfare conditionality and free trade paired with social liberalism."
    positions:
      market_role: [central, core]
      welfare_provision: [insurance_contributory, core]
      work_ethic: [work_is_duty, core]
      borders: [open, strong]
      punishment: [deterrent_proportional, strong]
      state_scope: [limited, strong]
      transition_method: [gradual_reform, core]
      class_analysis: [rejected, strong]
  - id: radical_centrism
    name: "Radical centrism"
    prior_weight: 0.08
    blurb: "Take the best ideas from both sides and implement them aggressively, unbound by tribal loyalty."
    positions:
      utopian_horizon: [gradual_improvement, core]
      epistemic_authority: [scientific_expertise, core]
      class_analysis: [rejected, core]
      decision_procedure: [expert_rule, strong]
      economic_coordination: [regulated_market, core]
      political_pluralism: [multiparty, strong]
      transition_method: [gradual_reform, core]
      basic_income: [support_ubi, typical]
