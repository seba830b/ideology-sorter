    name: "Liberal corporatism"
    aliases: [tripartism, neocorporatism]
    prior_weight: 0.06
    blurb: "Government, employers and unions bargaining national policy together at one table."
    positions:
      organisation_form: [union, core]
      economic_coordination: [regulated_market, core]
      class_analysis: [status_group, core]
      decision_procedure: [expert_rule, strong]
