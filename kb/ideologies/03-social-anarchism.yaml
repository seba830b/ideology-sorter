ideologies:

  - id: anarcho_communism
    name: Anarcho-communism
    aliases: [libertarian communism, Kropotkin]
    prior_weight: 0.9
    blurb: "No state, no wages, no money — free federations taking from a common store according to need."
    positions:
      state_trajectory: [abolish_now, core]
      property_regime: [communal, core]
      market_role: [abolished, core]
      money_form: [abolished, core]
      wage_labour: [abolish_entirely, core]
      distribution_principle: [need, core]
      hierarchy_stance: [abolish, core]
      decision_procedure: [direct_democracy, core]
      organisation_form: [federation, core]
      policing: [abolish, core]
      electoral_participation: [boycott, core]
      human_nature: [cooperative_good, core]
      welfare_provision: [mutual_aid, core]
      punishment: [abolitionist, strong]
      scale_of_polity: [village_commune, strong]
      transition_method: [insurrection, strong]

  - id: anarcho_syndicalism
    name: Anarcho-syndicalism
    aliases: [CNT, revolutionary unionism]
    prior_weight: 0.7
    blurb: "Revolutionary unions both fight capital now and become the structure that runs production afterwards."
    positions:
      organisation_form: [union, core]
      transition_method: [general_strike, core]
      firm_form: [worker_cooperative, core]
      state_trajectory: [abolish_now, core]
      decision_procedure: [delegation_recallable, core]
      hierarchy_stance: [abolish, core]
      electoral_participation: [boycott, core]
      property_regime: [communal, strong]
      wage_labour: [abolish_entirely, strong]
      class_analysis: [central_marxist, typical]
      policing: [community_controlled, strong]
      federalism: [confederal, core]

  - id: collectivist_anarchism
    name: Collectivist anarchism
    aliases: [Bakuninism]
    prior_weight: 0.25
    blurb: "Collective ownership of the means of production, but people are still paid for the labour they contribute."
    positions:
      property_regime: [communal, core]
      distribution_principle: [contribution_labour, core]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      transition_method: [insurrection, strong]
      organisation_form: [federation, core]
      decision_procedure: [direct_democracy, strong]
      money_form: [mutual_credit, typical]
      electoral_participation: [boycott, core]
      religion_in_public_life: [militantly_secular, strong]

  - id: platformism
    name: Platformism
    aliases: [Dielo Truda, especifist organisation]
    prior_weight: 0.15
    blurb: "Anarchists need a disciplined organisation with a common line — theoretical unity and collective responsibility."
    positions:
      organisation_form: [federation, core]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      decision_procedure: [delegation_recallable, core]
      transition_method: [insurrection, strong]
      property_regime: [communal, strong]
      vanguard_role: [useful, typical]
      class_analysis: [central_marxist, strong]
      electoral_participation: [boycott, core]

  - id: especifismo
    name: Especifismo
    aliases: [FARJ, social insertion]
    prior_weight: 0.08
    blurb: "A specifically anarchist organisation works inside broader popular movements without trying to lead them."
    positions:
      organisation_form: [federation, core]
      transition_method: [prefigurative, core]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      decision_procedure: [direct_democracy, core]
      class_analysis: [central_marxist, strong]
      colonialism_stance: [reparative_decolonial, strong]
      electoral_participation: [boycott, core]
      education_aim: [critical_consciousness, strong]

  - id: synthesis_anarchism
    name: Synthesis anarchism
    aliases: [Voline, Faure, anarchism without adjectives]
    prior_weight: 0.1
    blurb: "Communists, syndicalists and individualists should share one organisation rather than split over the future."
    positions:
      organisation_form: [federation, core]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      decision_procedure: [consensus, core]
      property_regime: [mutualist_possession, typical]
      speech_norms: [absolutist, strong]
      electoral_participation: [boycott, core]
      utopian_horizon: [none_pragmatic, typical]

  - id: makhnovism
    name: Makhnovism
    aliases: [Revolutionary Insurrectionary Army of Ukraine]
    prior_weight: 0.1
    blurb: "Armed peasant self-defence holding free territory against every state that claimed it."
    positions:
      state_trajectory: [abolish_now, core]
      legitimate_violence: [communal_militia, core]
      urban_rural: [agrarian_rural, core]
      land_regime: [commons, core]
      transition_method: [insurrection, core]
      decision_procedure: [direct_democracy, strong]
      hierarchy_stance: [abolish, strong]
      federalism: [confederal, strong]
