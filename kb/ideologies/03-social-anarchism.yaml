  - id: queer_anarchism
    name: Queer anarchism
    aliases: [anarcha-queer]
    prior_weight: 0.15
    blurb: "The state, the family and gender itself are linked systems of domination to be abolished together."
    positions:
      sexuality_stance: [queer_abolitionist, core]
      gender_order: [abolish_gender, core]
      family_form: [abolish_family, strong]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      organisation_form: [affinity_group, strong]
      policing: [abolish, core]
      punishment: [abolitionist, strong]
