    name: Magonism
    aliases: [Mexican Liberal Party, Flores Magón]
    prior_weight: 0.05
    blurb: "Land and liberty — indigenous communal landholding as the base of an anarchist revolution."
    positions:
      land_regime: [commons, core]
      indigenous_sovereignty: [land_return, core]
      state_trajectory: [abolish_now, core]
      urban_rural: [agrarian_rural, strong]
      transition_method: [insurrection, strong]
      hierarchy_stance: [abolish, core]
      colonialism_stance: [reparative_decolonial, strong]
      scale_of_polity: [village_commune, strong]
      property_regime: [communal, strong]

  - id: bookchinist_communalism
    name: Communalism
    aliases: [libertarian municipalism, social ecology, Bookchin]
    prior_weight: 0.35
    blurb: "Face-to-face citizen assemblies in each municipality, confederated upward, with ecology as the organising insight."
    positions:
      scale_of_polity: [municipal_confederal, core]
      state_trajectory: [replace_with_confederation, core]
      ecology_priority: [primary_frame, core]
      decision_procedure: [direct_democracy, core]
      transition_method: [electoral, strong]
      electoral_participation: [central, strong]
      federalism: [confederal, core]
      hierarchy_stance: [abolish, core]
      land_regime: [commons, strong]
      technology_stance: [appropriate_scale, strong]
      market_role: [abolished, strong]
      education_aim: [civic_formation, strong]
      human_nature: [perfectible, typical]

