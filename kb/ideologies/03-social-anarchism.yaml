    name: Anarcha-feminism
    aliases: [Goldman, de Cleyre]
    prior_weight: 0.2
    blurb: "Patriarchy is the oldest hierarchy; no revolution that leaves the household untouched is a revolution."
    positions:
      gender_order: [structural_liberation, core]
      family_form: [communal_rearing, strong]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      domestic_labour: [communised, core]
      reproductive_politics: [reproductive_freedom, core]
      sexuality_stance: [liberationist, strong]
      decision_procedure: [direct_democracy, strong]
