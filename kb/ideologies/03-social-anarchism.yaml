    name: Democratic confederalism
    aliases: [Öcalan, Rojava, Apoism]
    prior_weight: 0.3
    blurb: "Stateless self-administration through councils, with women's liberation and ecology written into its foundations."
    positions:
      scale_of_polity: [municipal_confederal, core]
      state_trajectory: [replace_with_confederation, core]
      gender_order: [structural_liberation, core]
      ecology_priority: [central_constraint, strong]
      decision_procedure: [direct_democracy, core]
      federalism: [confederal, core]
      nation_concept: [post_national, strong]
      legitimate_violence: [communal_militia, core]
      hierarchy_stance: [abolish, strong]
      nationalism_stance: [hostile, strong]
      policing: [community_controlled, strong]
      firm_form: [worker_cooperative, strong]

  - id: zapatismo
    name: Zapatismo
    aliases: [EZLN, neozapatismo, mandar obedeciendo]
    prior_weight: 0.25
    blurb: "Indigenous autonomy governed by assemblies whose delegates lead by obeying, refusing to take state power."
    positions:
      indigenous_sovereignty: [primary_frame, core]
      decision_procedure: [consensus, core]
      leadership_form: [rotating_delegates, core]
      state_trajectory: [abolish_now, strong]
      scale_of_polity: [village_commune, core]
      land_regime: [commons, core]
      electoral_participation: [boycott, core]
      transition_method: [prefigurative, core]
      colonialism_stance: [reparative_decolonial, core]
      hierarchy_stance: [abolish, strong]
      gender_order: [structural_liberation, strong]

  - id: anarcho_pacifism
    name: Anarcho-pacifism
    prior_weight: 0.12
    blurb: "The state rests on violence, so it must be dissolved by refusal and non-cooperation rather than by force."
    positions:
      violence_legitimacy: [never, core]
      legitimate_violence: [none_pacifist, core]
      state_trajectory: [abolish_now, core]
      transition_method: [withdrawal, core]
      hierarchy_stance: [abolish, core]
      punishment: [abolitionist, strong]
      policing: [abolish, strong]
      human_nature: [cooperative_good, strong]
      welfare_provision: [mutual_aid, strong]

  - id: christian_anarchism
    name: Christian anarchism
    aliases: [Tolstoyan, Catholic Worker]
    prior_weight: 0.1
    blurb: "No one may rule another because only God is sovereign; the Sermon on the Mount forbids the state's violence."
    positions:
      sovereignty_locus: [divine, core]
      violence_legitimacy: [never, core]
      state_trajectory: [abolish_now, core]
      religion_in_public_life: [spiritual_syncretic, strong]
      rights_basis: [divine_law, core]
      welfare_provision: [mutual_aid, core]
      property_in_person: [divine_stewardship, strong]
      property_regime: [communal, strong]
      urban_rural: [agrarian_rural, strong]
      hierarchy_stance: [abolish, core]
      work_ethic: [work_is_virtue, strong]

  - id: anarcho_naturism
    name: Anarcho-naturism
    aliases: [naturismo libertario]
    prior_weight: 0.03
    blurb: "Liberation from the state and from civilisation's habits together — nudism, vegetarianism and rural communes as anarchist practice."
    positions:
      technology_stance: [appropriate_scale, core]
      urban_rural: [back_to_land, core]
      nonhuman_status: [rights_bearing, core]
      state_trajectory: [abolish_now, core]
      ecology_priority: [primary_frame, strong]
      sexuality_stance: [liberationist, strong]
      hierarchy_stance: [abolish, core]
      scale_of_polity: [village_commune, strong]
      attitude_to_modernity: [reject_return, strong]
      healthcare: [communal_mutual, typical]

  - id: veganarchism
    name: Veganarchism
    prior_weight: 0.05
    blurb: "Human and animal liberation are one struggle against domination; anarchism that eats animals is incomplete."
    positions:
      nonhuman_status: [liberation_subject, core]
      state_trajectory: [abolish_now, core]
      hierarchy_stance: [abolish, core]
      ecology_priority: [primary_frame, strong]
      violence_legitimacy: [insurrectionary, typical]
      organisation_form: [affinity_group, strong]
      policing: [abolish, strong]
      property_regime: [communal, strong]

  - id: anarcho_transhumanism
    name: Anarcho-transhumanism
    prior_weight: 0.05
    blurb: "Technology should be seized and distributed to abolish every biological and social constraint on freedom."
    positions:
      technology_stance: [transhuman, core]
      state_trajectory: [abolish_now, core]
      death_and_finitude: [defeat_technologically, core]
      gender_order: [abolish_gender, strong]
      hierarchy_stance: [abolish, core]
      attitude_to_modernity: [transcend_forward, core]
      property_in_person: [self_ownership_absolute, strong]
