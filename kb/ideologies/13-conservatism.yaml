      religion_in_public_life: [established_church, strong]
      property_regime: [private_regulated, strong]
      reform_vs_rupture: [reform, core]
  - id: traditionalist_conservatism
    name: "Traditionalist conservatism"
    aliases: [Kirk, Weaver]
    prior_weight: 0.2
    blurb: "A permanent moral order exists; culture, custom and religion matter more than markets or constitutions."
    positions:
      tradition_stance: [conserve, core]
