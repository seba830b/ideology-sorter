ideologies:
  - id: burkean_conservatism
    name: "Burkean conservatism"
    prior_weight: 0.6
    blurb: "Society is an inheritance too complex to redesign; reform slowly, in the grain of what already works."
    positions:
      tradition_stance: [conserve, core]
      transition_method: [gradual_reform, core]
      epistemic_authority: [tradition, core]
      human_nature: [fallen_needs_restraint, core]
