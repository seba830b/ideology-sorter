  - id: q_ecology_managed_cost
    tenet: ecology_priority
    tier: 2
    prompt: "Environmental damage is a cost to be priced and managed, like any other."
    expected: {managed_externality: 2, dismissed: 1, central_constraint: -1, primary_frame: -2, misanthropic_deep: -2}
