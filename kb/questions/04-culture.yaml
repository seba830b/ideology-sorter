  - id: q_esoteric_tradition
    tenet: tradition_stance
    tier: 3
    prompt: "Beneath the surface of the great traditions lies a single hidden truth that modernity has lost."
    expected: {transcend_esoteric: 2, restore: 1, conserve: 0, reject: -2, critically_inherit: -1}
  - id: q_revelation_settles_it
