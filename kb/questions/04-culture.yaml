  - id: q_education_ideological
    tenet: education_aim
    tier: 3
    prompt: "Schools should form citizens in the movement's political outlook."
    expected: {ideological_formation: 2, civic_formation: 1, transmit_tradition: 0, individual_flourishing: -2, technical_capacity: -1}
  - id: q_art_preserve_canon
    tenet: art_and_culture
    tier: 3
    prompt: "The great works of the past should be preserved and taught as a standard."
