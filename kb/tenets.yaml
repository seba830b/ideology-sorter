# Controlled vocabulary. Changing an option invalidates every ideology that uses it.
#
# kind: ordered     -> adjacent options are near-misses; partial credit applies
# kind: categorical -> options are unrelated; no partial credit, ever
#
# `state_trajectory` is categorical on purpose: abolish_now must never collect credit
# from minimal. That confusion is the standard failure of axis-based political tests.

